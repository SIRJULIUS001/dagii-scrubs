{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container py-5">
  <div class="row">
    <div class="col-md-8 offset-md-2">
      <h2 class="mb-3">{{ post.title }}</h2>
      <p><small class="text-muted">Published on {{ post.created_at|date:"F j, Y" }}</small></p>
      {% if post.image %}
        <img src="{{ post.image.url }}" class="img-fluid mb-4 rounded" alt="{{ post.title }}">
      {% endif %}
      <p>{{ post.content|linebreaks }}</p>
      <a href="{% url 'blog_list' %}" class="btn btn-secondary mt-3">← Back to Blog</a>
    </div>
  </div>
</div>
{% endblock %}
